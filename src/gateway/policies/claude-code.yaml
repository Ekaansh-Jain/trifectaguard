# Claude Code's built-in tools, for hook mode (python -m src.gateway hook).
#
# Bash can't be classified completely from its text; these patterns only ADD
# scrutiny to commands that can send data out or hide what they do. The hook
# never allows anything, so everything else still goes through Claude Code's
# own permission settings.
name: claude-code
vars:
  secret_paths: ["*.env", "*.env.*", "*/.env*", "*secret*", "*credential*",
                 "*id_rsa*", "*id_ed25519*", "*.pem", "*.key", "*.p12",
                 "*/.aws/*", "*/.ssh/*", "*/.netrc", "*/.npmrc", "*/.pypirc",
                 "*/.docker/config.json", "*/.kube/config"]
  # code other people wrote, even though it's on your disk
  untrusted_paths: ["*/node_modules/*", "*/site-packages/*", "*/Downloads/*", "*/vendor/*"]
  # your open-source checkouts: reading them isn't reading private data
  public_paths: []
  # writes here change what runs next: CI, git hooks, shell startup, agent config
  exec_paths: ["*/.github/workflows/*", "*/.git/hooks/*", "*/.bashrc", "*/.zshrc",
               "*/.profile", "*/.bash_profile", "*/.zprofile", "*/.config/fish/*",
               "*/Library/LaunchAgents/*", "*/.claude/settings*.json", "*/.claude/hooks/*",
               "*/.claude/commands/*", "*/.claude/agents/*", "*/.claude/skills/*", "*/.mcp.json",
               "*/.cursor/*", "*/.vscode/tasks.json", "*/crontab"]
  shared_paths: []  # synced/shared folders: a write there leaves the machine
  trusted_urls: []  # e.g. "https://docs.python.org/*"
  # Bash is parsed into programs and arguments (src/gateway/shell.py); these lists
  # name programs, not substrings, so `grep -c` or "email" never match.
  egress_programs: [curl, wget, nc, ncat, netcat, socat, ssh, scp, sftp, rsync, ftp, tftp, telnet,
                    mail, mailx, sendmail, http, https, xh, aws, gcloud, gsutil, az, nslookup, dig, host]
  egress_subcommands: ["git push", "git remote add", "git send-email", "npm publish", "pnpm publish",
                       "yarn publish", "twine upload", "docker push", "docker login", "cargo publish",
                       "gem push", "gh api", "gh pr create", "gh pr comment", "gh pr edit", "gh pr merge",
                       "gh pr review", "gh issue create", "gh issue comment", "gh issue edit",
                       "gh release create", "gh gist create", "gh repo create", "gh secret set"]
  # these bring back content someone else wrote
  fetch_subcommands: ["git clone", "git pull", "git fetch", "gh pr view", "gh pr diff", "gh pr list",
                      "gh pr checks", "gh issue view", "gh issue list", "gh run view", "gh repo view", "gh api"]
  # inline code (python -c, node -e, heredocs): network use is visible as imports and calls,
  # not as words (a script editing a README that mentions "https" isn't networking)
  network_modules: [urllib, urllib3, requests, httpx, http.client, httplib2, socket, aiohttp, smtplib,
                    ftplib, paramiko, pycurl, websocket, websockets, openai, anthropic, groq, boto3,
                    axios, node-fetch, "http", "https", net]
  dynamic_code_markers: ["exec(", "eval(", "compile(", "__import__", "importlib", "b64decode", "codecs",
                         "marshal", "subprocess", "os.system", "os.popen", "child_process", "Function("]
  secret_code_markers: [".env", "dotenv", "credentials", "id_rsa", ".aws/", ".ssh/"]
  destructive_commands: ["rm -rf*", "rm -r *", "rm -fr*", "git reset --hard*", "git clean -*f*",
                         "git push*--force*", "git push -f*", "*drop table*", "*drop database*", "mkfs*",
                         "dd if=*"]

x-read: &read
  - when: {file_path: $secret_paths}
    reads: [private, secret]
  - when: {file_path: $untrusted_paths}
    reads: [untrusted, private]
  - when: {file_path: $public_paths}
    reads: []
  - reads: [private]

x-write: &write
  - when: {file_path: $exec_paths}
    writes: exec
  - when: {file_path: $shared_paths}
    writes: external
  - writes: local

tools:
  Read: *read
  Grep: {reads: [private]}
  Glob: {reads: [private]}
  LS: {reads: [private]}
  Write: *write
  Edit: *write
  MultiEdit: *write
  NotebookEdit:
    - when: {notebook_path: $shared_paths}
      writes: external
    - writes: local
  WebSearch: {reads: [untrusted]}
  WebFetch:
    - when: {url: $trusted_urls}
      reads: [untrusted]
    - reads: [untrusted]
      writes: external
      destination: [url]
      destination_carries_data: true
  Bash:
    classifier: shell

# Claude Code's other tools (todo lists, subagents, questions to you, …) move no
# data by themselves; subagents' own tool calls go through the hook as well.
unclassified: {}
