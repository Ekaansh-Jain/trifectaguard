# mcp-server-fetch (verified tool list).
# A fetched page is untrusted. The request itself is also an exfiltration
# channel: data can ride out in the URL path or query, so fetch is an external
# sink too — unless the URL matches trusted_urls.
name: fetch
vars:
  trusted_urls: []  # e.g. "https://docs.python.org/*"

tools:
  fetch:
    - when: {url: $trusted_urls}
      reads: [untrusted]
    - reads: [untrusted]
      writes: external
