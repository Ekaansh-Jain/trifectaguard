name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install ".[mcp]" pytest hypothesis
      - name: Unit, end-to-end, property and robustness tests
        run: python -m pytest -q --junitxml=junit.xml tests/test_flow_engine.py tests/test_gateway_e2e.py tests/test_hook.py tests/test_guard.py tests/test_scan.py tests/test_properties.py tests/test_shell.py tests/test_robustness.py tests/test_new_user.py
      - name: Publish failing tests as annotations (readable without logging in)
        if: failure()
        shell: python
        env:
          PYTHONIOENCODING: utf-8  # test output can hold symbols the Windows console encoding can't
        run: |
          import xml.etree.ElementTree as ET
          for case in ET.parse("junit.xml").iter("testcase"):
              for bad in list(case.iter("failure")) + list(case.iter("error")):
                  detail = (bad.get("message") or "") + "\n" + (bad.text or "")[-1500:]
                  msg = detail.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title={case.get('classname')}.{case.get('name')}::{msg}")
      - name: Red-team suite (attacks on trifectaguard's own rules)
        run: python eval/redteam/adaptive.py
      - name: Master scenarios through the library, the Claude Code hooks and the MCP proxy
        run: python eval/scenarios/run.py
      - name: The installed command works
        run: trifectaguard scan --json
        continue-on-error: true  # exits 1 when the runner's own setup is exposed; that's fine here
